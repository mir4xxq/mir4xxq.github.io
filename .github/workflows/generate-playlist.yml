name: Generate Playlist JSON

on:
  push:
    paths:
      - 'songs/**'
      - '.github/workflows/**'
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем явные права на запись файлов
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate playlist.json
        run: |
          echo "[" > playlist.json
          first=true
          for file in songs/*.mp3 songs/*.MP3; do
            if [ -f "$file" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> playlist.json
              fi
              # Экранируем имя файла для валидного JSON
              filename=$(basename "$file")
              echo "  {\"src\": \"songs/$filename\"}" >> playlist.json
            fi
          done
          echo "]" >> playlist.json

      - name: Commit and push playlist.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "auto: update playlist.json" || exit 0
          git push
