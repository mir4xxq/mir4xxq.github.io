name: Generate Playlist JSON

on:
  push:
    paths:
      - 'songs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate playlist.json
        run: |
          echo "[" > playlist.json
          first=true
          for file in songs/*.mp3; do
            if [ -f "$file" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> playlist.json
              fi
              echo "{\"src\": \"$file\"}" >> playlist.json
            fi
          done
          echo "]" >> playlist.json

      - name: Commit and push playlist.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "auto: update playlist.json" || exit 0
          git push
